<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Monkey Slot 5×5</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,#573c17,#130b06 70%);
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:12px;
}

.card{
  background:linear-gradient(#33200e,#1b1007);
  border:2px solid #b67a19;
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.4);
}

h1,h2{
  text-align:center;
  color:#ffd24a;
  margin-bottom:12px;
}

input,button{
  width:100%;
  padding:13px;
  margin-top:8px;
  border-radius:10px;
  border:none;
}

input{
  background:#fff8e6;
  color:#111;
  font-size:16px;
}

button{
  background:linear-gradient(#ffcf39,#b66b00);
  color:#2d1800;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.6;
}

.hidden{
  display:none!important;
}

.blue{
  background:#287bd8;
  color:#fff;
}

.green{
  background:#2e9e52;
  color:#fff;
}

.danger{
  background:#b52d2d;
  color:#fff;
}

.top{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:10px;
}

.info{
  text-align:center;
  background:#1d1108;
  border:1px solid #9d6718;
  border-radius:10px;
  padding:8px;
}

.info small{
  display:block;
  color:#d9ba70;
  font-size:11px;
}

.info strong{
  display:block;
  color:#ffd24a;
  font-size:18px;
  margin-top:4px;
  word-break:break-word;
}

.machine{
  background:linear-gradient(145deg,#bd8016,#623707);
  border:4px solid #f3c440;
  border-radius:20px;
  padding:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
  background:#130a05;
  padding:7px;
  border-radius:13px;
}

.cell{
  aspect-ratio:1/1;
  min-height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(26px,8vw,48px);
  background:linear-gradient(#fff8dc,#d9c281);
  border:2px solid #875f15;
  border-radius:8px;
  transition:.2s;
}

.cell.win{
  background:#ffd32e;
  box-shadow:0 0 12px #fff,0 0 20px #ffbd00;
  transform:scale(1.05);
}

.cell.scatter{
  background:#b9e7ff;
  box-shadow:0 0 12px #fff;
}

.cell.spin{
  animation:move .1s infinite;
}

@keyframes move{
  0%{transform:translateY(-3px)}
  50%{transform:translateY(3px)}
  100%{transform:translateY(-3px)}
}

.message{
  margin-top:10px;
  min-height:48px;
  padding:12px;
  border-radius:10px;
  background:#211308;
  color:#ffd44d;
  text-align:center;
  font-weight:bold;
  font-size:17px;
}

.bet-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.bet-row button{
  width:60px;
  margin:0;
  font-size:23px;
}

.bet-box{
  flex:1;
  text-align:center;
  padding:12px;
  border-radius:10px;
  background:#160c06;
  border:1px solid #b57b1c;
  color:#ffd34a;
  font-weight:bold;
  font-size:18px;
}

.spin-btn{
  margin-top:12px;
  padding:17px;
  font-size:23px;
  border:3px solid #ffe68c;
}

.player{
  background:#1c1008;
  border:1px solid #704513;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
}

.player button{
  margin-top:6px;
}

.history-item{
  padding:10px;
  margin-top:6px;
  background:#211409;
  border-radius:8px;
  border-left:3px solid #d99a20;
}

.small{
  color:#d6bf8a;
  font-size:12px;
  line-height:1.5;
}

.win-popup{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.75);
  z-index:1000;
}

.win-popup.show{
  display:flex;
}

.win-box{
  width:85%;
  max-width:420px;
  padding:30px 20px;
  text-align:center;
  border-radius:25px;
  background:linear-gradient(#573a08,#1c1004);
  border:4px solid #ffd43b;
  animation:pop .3s ease;
}

@keyframes pop{
  from{
    transform:scale(.5);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.win-title{
  font-size:32px;
  font-weight:bold;
  color:#ffe14a;
}

.win-amount{
  font-size:42px;
  margin:15px 0;
  color:#fff;
}

.admin-title{
  color:#ffd24a;
  text-align:center;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<!-- ================= LOGIN ================= -->

<div id="loginPage">

  <div class="card">

    <h1>🐵 MONKEY SLOT 🐵</h1>

    <input
      id="phone"
      placeholder="Phone Number"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      LOGIN
    </button>

    <button
      class="blue"
      onclick="showRegister()"
    >
      CREATE ACCOUNT
    </button>

    <button
      class="danger"
      onclick="adminLogin()"
    >
      👑 ADMIN LOGIN
    </button>

    <p
      class="small"
      style="text-align:center;margin-top:12px"
    >
      Demo virtual coin game
    </p>

  </div>

</div>


<!-- ================= REGISTER ================= -->

<div
  id="registerPage"
  class="hidden"
>

  <div class="card">

    <h2>👤 CREATE ACCOUNT</h2>

    <input
      id="regName"
      placeholder="Player Name"
    >

    <input
      id="regPhone"
      placeholder="Phone Number"
    >

    <input
      id="regPassword"
      type="password"
      placeholder="Password"
    >

    <button
      class="green"
      onclick="registerPlayer()"
    >
      CREATE ACCOUNT
    </button>

    <button
      class="blue"
      onclick="backLogin()"
    >
      BACK TO LOGIN
    </button>

  </div>

</div>


<!-- ================= GAME ================= -->

<div
  id="gamePage"
  class="hidden"
>

  <div class="card">

    <h1>🐵 MONKEY SLOT 5×5 🐵</h1>

    <div class="top">

      <div class="info">
        <small>PLAYER</small>
        <strong id="playerName"></strong>
      </div>

      <div class="info">
        <small>COINS</small>
        <strong id="balance">0</strong>
      </div>

      <div class="info">
        <small>SPINS</small>
        <strong id="spins">0</strong>
      </div>

      <div class="info">
        <small>FREE SPINS</small>
        <strong id="freeSpins">0</strong>
      </div>

    </div>


    <div class="machine">

      <div
        class="grid"
        id="grid"
      ></div>

      <div
        class="message"
        id="message"
      >
        🎰 Press SPIN
      </div>

      <div class="bet-row">

        <button
          onclick="changeBet(-10)"
        >
          −
        </button>

        <div class="bet-box">

          BET:
          <span id="bet">10</span>

        </div>

        <button
          onclick="changeBet(10)"
        >
          +
        </button>

      </div>

      <button
        id="spinBtn"
        class="spin-btn"
        onclick="spin()"
      >
        🎰 SPIN
      </button>

    </div>


    <button
      class="blue"
      onclick="showHistory()"
    >
      📜 MY HISTORY
    </button>

    <button
      class="danger"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </div>

</div>


<!-- ================= HISTORY ================= -->

<div
  id="historyPage"
  class="hidden"
>

  <div class="card">

    <h2>📜 MY HISTORY</h2>

    <div id="history"></div>

    <button
      class="blue"
      onclick="backGame()"
    >
      BACK TO GAME
    </button>

  </div>

</div>


<!-- ================= ADMIN ================= -->

<div
  id="adminPage"
  class="hidden"
>

  <div class="card">

    <h1>👑 GAME ADMIN</h1>

    <div id="adminPlayers"></div>

    <button
      class="blue"
      onclick="logout()"
    >
      LOGOUT ADMIN
    </button>

  </div>

</div>

</div>


<!-- ================= WIN POPUP ================= -->

<div
  id="winPopup"
  class="win-popup"
>

  <div class="win-box">

    <div
      id="winTitle"
      class="win-title"
    >
      WIN!
    </div>

    <div
      id="winAmount"
      class="win-amount"
    >
      0
    </div>

    <button onclick="closeWinPopup()">
      CONTINUE
    </button>

  </div>

</div>


<script>

/* =========================================
   CONFIG
========================================= */

const ADMIN_PHONE = "admin";
const ADMIN_PASSWORD = "123456";

const symbols = [
  "🐵",
  "🍌",
  "🐯",
  "🦁",
  "🍇",
  "🥥",
  "🎁"
];

const SCATTER = "🎁";

let currentUser = null;

let bet = 10;

let spinning = false;

let freeSpins = 0;

let cells = [];


/* =========================================
   DATABASE
========================================= */

function getPlayers(){

  return JSON.parse(
    localStorage.getItem(
      "monkeyPlayers"
    ) || "[]"
  );

}


function savePlayers(players){

  localStorage.setItem(
    "monkeyPlayers",
    JSON.stringify(players)
  );

}


/* =========================================
   PAGE CONTROL
========================================= */

function hideAll(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("registerPage")
    .classList.add("hidden");

  document
    .getElementById("gamePage")
    .classList.add("hidden");

  document
    .getElementById("historyPage")
    .classList.add("hidden");

  document
    .getElementById("adminPage")
    .classList.add("hidden");

}


function showRegister(){

  hideAll();

  document
    .getElementById("registerPage")
    .classList.remove("hidden");

}


function backLogin(){

  hideAll();

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

}


function logout(){

  currentUser = null;

  freeSpins = 0;

  hideAll();

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

}


/* =========================================
   REGISTER
========================================= */

function registerPlayer(){

  const name =
    document
      .getElementById("regName")
      .value
      .trim();

  const phone =
    document
      .getElementById("regPhone")
      .value
      .trim();

  const password =
    document
      .getElementById("regPassword")
      .value;


  if(
    !name ||
    !phone ||
    !password
  ){

    alert(
      "Please fill all fields"
    );

    return;

  }


  let players =
    getPlayers();


  if(
    players.some(
      p => p.phone === phone
    )
  ){

    alert(
      "Phone already registered"
    );

    return;

  }


  const player = {

    id:Date.now(),

    name:name,

    phone:phone,

    password:password,

    balance:1000,

    spins:0,

    blocked:false,

    history:[]

  };


  players.push(player);

  savePlayers(players);

  alert(
    "Account created successfully!"
  );

  backLogin();

}


/* =========================================
   PLAYER LOGIN
========================================= */

function login(){

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  let players =
    getPlayers();


  const player =
    players.find(
      p =>
        p.phone === phone &&
        p.password === password
    );


  if(!player){

    alert(
      "Wrong phone or password"
    );

    return;

  }


  if(player.blocked){

    alert(
      "Your account is blocked"
    );

    return;

  }


  currentUser = player;

  freeSpins = 0;

  startGame();

}


/* =========================================
   ADMIN LOGIN
========================================= */

function adminLogin(){

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if(
    phone === ADMIN_PHONE &&
    password === ADMIN_PASSWORD
  ){

    hideAll();

    document
      .getElementById("adminPage")
      .classList.remove("hidden");

    loadAdminPlayers();

  }

  else{

    alert(
      "Wrong admin login"
    );

  }

}


/* =========================================
   GAME START
========================================= */

function startGame(){

  hideAll();

  document
    .getElementById("gamePage")
    .classList.remove("hidden");


  document
    .getElementById("playerName")
    .innerText =
      currentUser.name;


  createGrid();

  updateGame();

}


function createGrid(){

  const grid =
    document
      .getElementById("grid");


  grid.innerHTML = "";

  cells = [];


  for(
    let i = 0;
    i < 25;
    i++
  ){

    const cell =
      document
        .createElement("div");


    cell.className =
      "cell";


    cell.innerText =
      randomSymbol();


    grid.appendChild(cell);

    cells.push(cell);

  }

}


function randomSymbol(){

  return symbols[
    Math.floor(
      Math.random() *
      symbols.length
    )
  ];

}


function updateGame(){

  document
    .getElementById("balance")
    .innerText =
      currentUser.balance;


  document
    .getElementById("spins")
    .innerText =
      currentUser.spins;


  document
    .getElementById("bet")
    .innerText =
      bet;


  document
    .getElementById("freeSpins")
    .innerText =
      freeSpins;

}


/* =========================================
   BET
========================================= */

function changeBet(amount){

  if(spinning) return;


  let newBet =
    bet + amount;


  if(newBet < 10){

    newBet = 10;

  }


  if(newBet > 30000){

    newBet = 30000;

  }


  if(
    newBet >
    currentUser.balance
  ){

    if(currentUser.balance >= 10){

      newBet =
        currentUser.balance;

    }

  }


  bet = newBet;

  updateGame();

}


/* =========================================
   SPIN
========================================= */

function spin(){

  if(spinning) return;


  let isFreeSpin =
    freeSpins > 0;


  if(
    !isFreeSpin &&
    currentUser.balance < bet
  ){

    alert(
      "Not enough coins"
    );

    return;

  }


  spinning = true;


  document
    .getElementById("spinBtn")
    .disabled = true;


  if(isFreeSpin){

    freeSpins--;

    document
      .getElementById("message")
      .innerText =
        "🎁 FREE SPIN!";

  }

  else{

    currentUser.balance -= bet;

    document
      .getElementById("message")
      .innerText =
        "🎰 SPINNING...";

  }


  currentUser.spins++;


  cells.forEach(c => {

    c.classList.remove(
      "win"
    );

    c.classList.remove(
      "scatter"
    );

    c.classList.add(
      "spin"
    );

  });


  const interval =
    setInterval(() => {

      cells.forEach(c => {

        c.innerText =
          randomSymbol();

      });

    },100);


  setTimeout(() => {

    clearInterval(interval);


    cells.forEach(c => {

      c.innerText =
        randomSymbol();

      c.classList.remove(
        "spin"
      );

    });


    /* Scatter */

    let scatterResult =
      checkScatter();


    /* Normal Win */

    let win =
      checkWins();


    currentUser.balance +=
      win;


    currentUser.history.push({

      time:
        new Date()
        .toLocaleString(),

      bet:
        isFreeSpin
        ? 0
        : bet,

      win:win,

      freeSpin:
        isFreeSpin,

      scatters:
        scatterResult

    });


    saveCurrentUser();


    updateGame();


    spinning = false;


    document
      .getElementById("spinBtn")
      .disabled = false;


    if(win > 0){

      showWinPopup(win);

    }

  },1500);

}


/* =========================================
   SCATTER
========================================= */

function checkScatter(){

  let scatterCount = 0;


  cells.forEach(cell => {

    if(
      cell.innerText ===
      SCATTER
    ){

      scatterCount++;

      cell.classList.add(
        "scatter"
      );

    }

  });


  if(scatterCount >= 5){

    freeSpins += 12;

    document
      .getElementById("message")
      .innerText =
        "🎁 5 SCATTERS! +12 FREE SPINS!";

  }

  else if(scatterCount === 4){

    freeSpins += 8;

    document
      .getElementById("message")
      .innerText =
        "🎁 4 SCATTERS! +8 FREE SPINS!";

  }

  else if(scatterCount === 3){

    freeSpins += 5;

    document
      .getElementById("message")
      .innerText =
        "🎁 3 SCATTERS! +5 FREE SPINS!";

  }


  return scatterCount;

}


/* =========================================
   WIN CHECK
   Horizontal rows
========================================= */

function checkWins(){

  let totalWin = 0;


  for(
    let row = 0;
    row < 5;
    row++
  ){

    let start =
      row * 5;


    let best = 1;

    let count = 1;

    let bestStart = 0;

    let currentStart = 0;


    for(
      let col = 1;
      col < 5;
      col++
    ){

      const current =
        cells[
          start + col
        ].innerText;


      const previous =
        cells[
          start + col - 1
        ].innerText;


      /* Scatter does not count */

      if(
        current === previous &&
        current !== SCATTER
      ){

        count++;

      }

      else{

        count = 1;

        currentStart = col;

      }


      if(count > best){

        best = count;

        bestStart =
          currentStart;

      }

    }


    let multiplier = 0;


    /* 3 = 100% */

    if(best === 3){

      multiplier = 1;

    }


    /* 4 = 150% */

    else if(best === 4){

      multiplier = 1.5;

    }


    /* 5 = 200% */

    else if(best >= 5){

      multiplier = 2;

    }


    if(multiplier > 0){

      let win =
        Math.floor(
          bet *
          multiplier
        );


      totalWin += win;


      for(
        let i = bestStart;
        i < bestStart + best;
        i++
      ){

        cells[
          start + i
        ].classList.add(
          "win"
        );

      }

    }

  }


  return totalWin;

}


/* =========================================
   WIN POPUP
========================================= */

function showWinPopup(win){

  const title =
    document
      .getElementById("winTitle");


  const amount =
    document
      .getElementById("winAmount");


  /*
    WIN LEVEL
  */


  if(
    win >= bet * 20
  ){

    title.innerText =
      "⚡⚡ SPIN WIN ⚡⚡";

  }

  else if(
    win >= bet * 10
  ){

    title.innerText =
      "🔥 SUPER WIN 🔥";

  }

  else if(
    win >= bet * 5
  ){

    title.innerText =
      "🎉 BIG WIN 🎉";

  }

  else{

    title.innerText =
      "🎊 WIN! 🎊";

  }


  amount.innerText =
    "+" + win +
    " COINS";


  document
    .getElementById("winPopup")
    .classList.add("show");

}


function closeWinPopup(){

  document
    .getElementById("winPopup")
    .classList.remove("show");

}


/* =========================================
   SAVE USER
========================================= */

function saveCurrentUser(){

  let players =
    getPlayers();


  let index =
    players.findIndex(
      p =>
        p.id ===
        currentUser.id
    );


  if(index !== -1){

    players[index] =
      currentUser;

    savePlayers(players);

  }

}


/* =========================================
   HISTORY
========================================= */

function showHistory(){

  hideAll();


  document
    .getElementById("historyPage")
    .classList.remove("hidden");


  const box =
    document
      .getElementById("history");


  box.innerHTML = "";


  if(
    !currentUser.history ||
    currentUser.history.length === 0
  ){

    box.innerHTML =
      "<p class='small'>" +
      "No game history yet." +
      "</p>";

    return;

  }


  currentUser.history
    .slice()
    .reverse()
    .forEach(h => {


      const item =
        document
          .createElement("div");


      item.className =
        "history-item";


      item.innerHTML =

        "🎰 " +
        h.time +

        "<br>💰 BET: " +
        h.bet +

        "<br>🏆 WIN: " +
        h.win +

        "<br>🎁 SCATTERS: " +
        h.scatters +

        (
          h.freeSpin
          ? "<br>🎁 FREE SPIN"
          : ""
        );


      box.appendChild(item);

    });

}


function backGame(){

  hideAll();


  document
    .getElementById("gamePage")
    .classList.remove("hidden");


  updateGame();

}


/* =========================================
   ADMIN
========================================= */

function loadAdminPlayers(){

  const players =
    getPlayers();


  const box =
    document
      .getElementById(
        "adminPlayers"
      );


  box.innerHTML = "";


  if(players.length === 0){

    box.innerHTML =
      "<p class='small'>" +
      "No players yet." +
      "</p>";

    return;

  }


  players.forEach(player => {


    const div =
      document
        .createElement("div");


    div.className =
      "player";


    div.innerHTML =

      "<b>👤 " +
      escapeHTML(
        player.name
      ) +
      "</b>" +

      "<br>📱 " +
      escapeHTML(
        player.phone
      ) +

      "<br>💰 Coins: " +
      player.balance +

      "<br>🎰 Spins: " +
      player.spins +

      "<br>Status: " +

      (
        player.blocked
        ? "🚫 BLOCKED"
        : "✅ ACTIVE"
      ) +


      "<button class='green' onclick='addCoins(" +
      player.id +
      ")'>" +
      "➕ ADD COINS" +
      "</button>" +


      "<button class='danger' onclick='removeCoins(" +
      player.id +
      ")'>" +
      "➖ REMOVE COINS" +
      "</button>" +


      "<button class='blue' onclick='toggleBlock(" +
      player.id +
      ")'>" +

      (
        player.blocked
        ? "✅ UNBLOCK"
        : "🚫 BLOCK"
      ) +

      "</button>" +


      "<button onclick='viewPlayerHistory(" +
      player.id +
      ")'>" +
      "📜 VIEW HISTORY" +
      "</button>";


    box.appendChild(div);

  });

}


/* =========================================
   ADMIN COINS
========================================= */

function addCoins(id){

  let amount =
    Number(
      prompt(
        "Coins to add:"
      )
    );


  if(
    !amount ||
    amount <= 0
  ) return;


  updatePlayerCoins(
    id,
    amount
  );

}


function removeCoins(id){

  let amount =
    Number(
      prompt(
        "Coins to remove:"
      )
    );


  if(
    !amount ||
    amount <= 0
  ) return;


  updatePlayerCoins(
    id,
    -amount
  );

}


function updatePlayerCoins(
  id,
  amount
){

  let players =
    getPlayers();


  let player =
    players.find(
      p =>
        p.id === id
    );


  if(!player) return;


  player.balance +=
    amount;


  if(
    player.balance < 0
  ){

    player.balance = 0;

  }


  savePlayers(players);


  loadAdminPlayers();

}


/* =========================================
   ADMIN BLOCK
========================================= */

function toggleBlock(id){

  let players =
    getPlayers();


  let player =
    players.find(
      p =>
        p.id === id
    );


  if(!player) return;


  player.blocked =
    !player.blocked;


  savePlayers(players);


  loadAdminPlayers();

}


/* =========================================
   ADMIN HISTORY
========================================= */

function viewPlayerHistory(id){

  let players =
    getPlayers();


  let player =
    players.find(
      p =>
        p.id === id
    );


  if(!player) return;


  if(
    !player.history ||
    player.history.length === 0
  ){

    alert(
      "No history yet."
    );

    return;

  }


  let text =

    "PLAYER: " +
    player.name +

    "\n\n";


  player.history
    .slice()
    .reverse()
    .forEach(h => {


      text +=

        h.time +

        "\nBET: " +
        h.bet +

        " | WIN: " +
        h.win +

        "\nSCATTERS: " +
        h.scatters +

        "\n\n";

    });


  alert(text);

}


/* =========================================
   SECURITY HELPER
========================================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
